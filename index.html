<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not To Do</title>
    <meta name="description" content="Not To Do logs the work you dodge, what you do instead, and how long you get away with it." />
    <script>
      // Runs before first paint: marks that JS works, and whether the intro was already seen.
      document.documentElement.classList.add('js');
      try {
        if (localStorage.getItem('ntd-intro-seen') === '1') document.documentElement.classList.add('intro-seen');
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Imbue&family=Inter:wght@400;500;600&display=swap" />
  </head>
  <body>
    <!-- 3D scene: decoration only. Image first, canvas fades in when the scene has loaded. -->
    <div class="scene" id="scene" aria-hidden="true">
      <img class="scene__fallback" src="/images/scene-fallback.jpg" alt="" width="1200" height="1500" fetchpriority="high" />
      <canvas class="scene__canvas" id="scene-canvas"></canvas>
    </div>

    <a class="skip-intro" href="#hero">Skip intro</a>

    <!-- Floating nav: built in a later session. Hidden during the intro. -->
    <header class="nav" id="nav" hidden></header>

    <main>
      <!-- Screen 0 · Intro -->
      <section class="intro" id="intro" aria-label="Intro">
        <div class="intro__stage">
          <p class="intro__lines" id="intro-lines">
            <span class="intro__part">In a world</span>
            <span class="intro__part">of corporate games</span>
            <span class="intro__part">be the most</span>
            <span class="intro__part">inefficient player.</span>
          </p>

          <a class="intro__hint" id="intro-hint" href="#hero">
            <span class="intro__hint-inner">
              Scroll
            </span>
          </a>
        </div>
      </section>

      <!-- Screen 1 · Hero (placeholder: final layout comes next session) -->
      <section class="hero" id="hero">
        <div class="hero__content" id="hero-content">
          <h1 class="hero__title">Climb nothing. Track everything.</h1>
          <a class="button" href="#signup">Start avoiding</a>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
